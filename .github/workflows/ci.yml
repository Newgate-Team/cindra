name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cindra
          POSTGRES_PASSWORD: cindra
          POSTGRES_DB: cindra
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cindra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://cindra:cindra@localhost:5433/cindra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      # CIN-148: the template renderer needs a Cyrillic font, the same
      # one the Dockerfile installs. Pinned here rather than trusting
      # whatever fonts the runner image happens to ship.
      #
      # The runner image preconfigures a Google Chrome apt source we
      # never use (we only need fonts-dejavu-core, from the standard
      # Ubuntu archive) -- dropped before `update` because that repo's
      # index has repeatedly failed with "Hash Sum mismatch" on the
      # runner's mirror, which fails the whole `apt-get update` and
      # blocks an install that has nothing to do with Chrome. Glob (not
      # a fixed filename) because noble-era runners register it as
      # deb822 `.sources`, not the legacy `.list` -- a plain
      # google-chrome.list silently matched nothing here.
      - name: Install fonts
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Lint
        run: ruff check .
      - name: Run migrations
        run: alembic upgrade head
      - name: Test
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
