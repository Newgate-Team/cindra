# Railway ties one config file to one Root Directory (confirmed via
# docs.railway.com/reference/config-as-code -- no documented
# multi-service syntax in a single file) -- so this file is shared by
# ALL THREE services built from apps/api: the API, and the Celery
# worker/beat added separately in the Railway Dashboard pointing at the
# same repo/root directory, each with its Start Command overridden (see
# apps/api/README.md):
#   worker: celery -A app.celery_app worker --loglevel=info
#   beat:   celery -A app.celery_app beat --loglevel=info
# Both skip the Dockerfile's default CMD (which includes the Alembic
# migration + uvicorn) since only the API service needs to serve HTTP
# or run migrations.
#
# CIN-92: healthcheckPath used to live here and broke worker/beat --
# neither serves HTTP, so Railway's healthcheck against a path defined
# for ALL THREE services always failed for them, and a blank
# per-service Dashboard override doesn't count as a real override (it's
# treated as "no override", not "disable"). Healthcheck is instead set
# as an explicit Dashboard override on the `cindra` API service only.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
